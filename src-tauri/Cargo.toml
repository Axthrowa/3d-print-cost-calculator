[package]
name = "baski-maliyet"
version = "2.3.1"
description = "3D Baski Maliyet Hesaplayici ve Siparis Yonetimi"
authors = ["Axthrowa"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "baski_maliyet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "multipart"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["time"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
